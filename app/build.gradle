plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.navigation.safeargs)
}

// Release signing is configured through keystore.properties (not in VCS, see
// keystore.properties.example). Without it the release build stays unsigned.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = 'xyz.zedler.patrick.grocy'
    compileSdk = 37

    defaultConfig {
        applicationId = "xyz.zedler.patrick.grocy.subloc"
        minSdk = 23
        targetSdk = 37
        versionCode = 65
        versionName = "3.9.0"
        resourceConfigurations += ['ca', 'cs', 'de', 'en', 'es', 'et', 'fr', 'hu', 'it', 'iw', 'ja',
                                   'nb', 'nl', 'pl', 'pt-rBR', 'pt-rPT', 'ru', 'sk', 'sv', 'uk',
                                   'zh-rCN', 'zh-rTW']
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile = rootProject.file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }

    // One installable app per grocy instance: same code, different
    // applicationId, so Android keeps separate data dirs and both can be
    // logged in at the same time. A flavor must not be called 'main'
    // (reserved source set name), hence 'home'.
    flavorDimensions = ['instance']
    productFlavors {
        home {
            dimension = 'instance'
        }
        holiday {
            dimension = 'instance'
            applicationIdSuffix = '.holiday'
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled = true
            shrinkResources = true
            // Upstream passes these as a closure, which silently applies no
            // rule file at all and makes every release build fail in R8.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            debuggable = false
        }
        debug {
            applicationIdSuffix = '.debug'
        }
    }

    buildFeatures {
        viewBinding = true
        dataBinding = true
        buildConfig = true
    }

    lint {
        abortOnError = false
        disable = ['MissingTranslation']
    }

    bundle {
        storeArchive {
            enable = true
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_21
    }

    dependenciesInfo {
        includeInApk = false
    }

    packagingOptions {
        jniLibs.useLegacyPackaging = false
    }
}

dependencies {
    implementation(libs.appcompat)
    implementation(libs.fragment)
    implementation(libs.preference)
    implementation(libs.browser)
    implementation(libs.webkit)
    implementation(libs.lifecycle.viewmodel.savedstate)
    implementation(libs.lifecycle.viewmodel)
    implementation(libs.paging)
    implementation(libs.kotlinx.serialization.json)
    // Navigation framework for easy navigation control using XML
    implementation(libs.navigation.fragment)
    implementation(libs.navigation.ui)
    // Android Room for database and RxJava for Async access of database
    implementation(libs.room.runtime)
    implementation(libs.room.rxjava3)
    annotationProcessor(libs.room.compiler)
    implementation(libs.rxandroid)
    // Material views
    implementation(libs.material)
    implementation(libs.calendar)
    implementation(libs.flexbox)
    // Volley for all general network requests and Glide for image loading
    implementation(libs.volley)
    implementation(libs.glide)
    implementation(libs.websocket.client)
    // GSON for converting JSON responses to Java objects
    implementation(libs.gson)
    // FuzzyWuzzy for fuzzy search in product names and autocompletion
    implementation(libs.fuzzywuzzy)
    // Work for daily notifications
    implementation(libs.work.runtime)
    // ZXing for barcode scanning
    implementation(libs.zxing.core)
    implementation(libs.zxing.android.embedded)
    // For image rotation
    implementation(libs.exifinterface)
    // https://github.com/journeyapps/zxing-android-embedded#option-2-desugaring-advanced
    // prevents bug https://github.com/patzly/grocy-android/issues/425
    coreLibraryDesugaring(libs.desugar)
}
