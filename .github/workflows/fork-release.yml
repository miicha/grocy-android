# Builds signed release APKs of the sublocations fork, one per instance
# flavor, and publishes them as a GitHub release. The assets are named so
# that Obtainium can track them per instance.
#
# Required repository secrets:
#   SIGNING_KEYSTORE_BASE64  base64 of the .jks  (base64 -w0 grocy-subloc.jks)
#   SIGNING_STORE_PASSWORD
#   SIGNING_KEY_ALIAS
#   SIGNING_KEY_PASSWORD
name: Fork release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish the APKs under'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "SIGNING_KEYSTORE_BASE64 is not set -- refusing to publish unsigned APKs" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > grocy-subloc.jks
          cat > keystore.properties <<PROPS
          storeFile=grocy-subloc.jks
          storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}
          keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}
          keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}
          PROPS

      - name: Build release APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleHomeRelease assembleHolidayRelease

      - name: Collect artifacts
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p deploy
          cp app/build/outputs/apk/home/release/app-home-release.apk \
             "deploy/grocy-subloc-home-$TAG.apk"
          cp app/build/outputs/apk/holiday/release/app-holiday-release.apk \
             "deploy/grocy-subloc-holiday-$TAG.apk"

      - name: Remove signing material
        if: always()
        run: rm -f grocy-subloc.jks keystore.properties

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: deploy/*.apk
          fail_on_unmatched_files: true
